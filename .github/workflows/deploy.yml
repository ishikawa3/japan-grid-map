name: Deploy web to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'scripts/lib/voltage.ts'
      - 'pnpm-lock.yaml'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter web build
        env:
          # 外部タイルホストを使う場合のみ設定する（CORS対応が必須。GitHub Releasesは不可、後述）。
          # vars.PMTILES_URL が未設定でもこのキー自体は空文字列として渡るが、
          # resolvePmtilesUrl() が空文字列を「未設定」として扱いリポジトリ同梱の
          # web/public/tiles/grid.pmtiles にフォールバックする。
          VITE_PMTILES_URL: ${{ vars.PMTILES_URL }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
